[package]
name = "benchmarks-protobufs"
version = "0.0.0"
edition = "2021"
publish = false
description = "Compares prost with Google's protobuf implementations (C++ and upb)"

# Not a member of the prost workspace: building Google protobuf takes a long
# time, and the `protobuf` crate name is already used by a workspace member.
[workspace]

[dependencies]
prost = { path = "../prost" }
# Google's official Rust protobuf with the upb kernel. Its version must match
# `PROTOBUF_TAG` in build.rs, because protobuf-codegen requires the same protoc.
protobuf = "=4.36.2-release"

[build-dependencies]
cmake = "0.1.51"
prost-build = { path = "../prost-build" }
protobuf-codegen = "=4.36.2-release"

[dev-dependencies]
criterion = { version = "0.8", default-features = false }

[lib]
bench = false

[[bench]]
name = "google"
harness = false

[profile.bench]
debug = true
